name: Render example diagrams
on:
  push:
    # paths: &filter-paths
    #   - examples/**.yaml
    #   - wiregen/**
    #   - pyproject.toml
  pull_request:
    paths: # *filter-paths
      - examples/**.yaml
      - wiregen/**
      - pyproject.toml
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Install wiregen
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
      - name: Render all example YAMLs to SVG
        run: |
          . .venv/bin/activate
          for yaml in examples/*.yaml; do
            base=$(basename "$yaml" .yaml)
            echo "Rendering $yaml → examples/${base}.svg"
            wiregen render "$yaml" -o "examples/${base}.svg"
          done
      - name: Commit and push rendered SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci: render example diagrams [skip ci]"
          git push
